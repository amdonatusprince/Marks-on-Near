[package]
name = "marks"
description = "On-chain perpetual order book for NEAR"
edition = "2021"
license = "MIT"
publish = false
version = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }
ed25519-dalek = "2"

[profile.release]
overflow-checks = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
