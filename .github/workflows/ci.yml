name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Prettier and TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web

  contract:
    name: Contract and token
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path contract/Cargo.toml -- --check
      - run: cargo test --manifest-path contract/Cargo.toml
      - run: cargo fmt --manifest-path token/Cargo.toml -- --check
      - run: cargo test --manifest-path token/Cargo.toml
