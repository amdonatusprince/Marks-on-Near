name: CI

on:
  push:
  pull_request:

jobs:
  format:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check

  app:
    name: App TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: agent/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: agent
      - run: pnpm typecheck
        working-directory: agent

  contract:
    name: Contract and token
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path contract/Cargo.toml -- --check
      - run: cargo test --manifest-path contract/Cargo.toml
      - run: cargo fmt --manifest-path token/Cargo.toml -- --check
      - run: cargo test --manifest-path token/Cargo.toml
      - run: cargo fmt --manifest-path oracle/Cargo.toml -- --check
      - run: cargo test --manifest-path oracle/Cargo.toml
